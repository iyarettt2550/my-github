<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Our Time Together ❤️</h1>
        <p class="subtitle">Since January 1, 2024</p>
        
        <div class="timer-container">
            <div class="time-box">
                <span id="days">0</span>
                <label>วัน</label>
            </div>
            <div class="time-box">
                <span id="hours">0</span>
                <label>ชั่วโมง</label>
            </div>
            <div class="time-box">
                <span id="minutes">0</span>
                <label>นาที</label>
            </div>
            <div class="time-box">
                <span id="seconds">0</span>
                <label>วินาที</label>
            </div>
        </div>

        <button id="heartBtn">กดหัวใจให้หน่อย 💖</button>
        <p id="msg" class="hidden">รักเสมอนะครับ! 🥰</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
